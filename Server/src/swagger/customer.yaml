openapi: 3.0.0
info:
  title: Customer API
  version: 1.0.0
  description: API documentation for Customer dropdown endpoints

tags:
  - name: Customer
    description: Operations related to customer data

paths:
  /api/maintenance/customer/dropdown:
    get:
      tags:
        - Customer
      summary: Get stations for active customers
      description: Returns a list of stations belonging to active customers, filtered by search term.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Search term to filter station names (case-insensitive, partial match).
      responses:
        "200":
          description: Successful response with station dropdown data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        stationId:
                          type: integer
                          example: 101
                        stationName:
                          type: string
                          example: "Mumbai Station"
                        customerId:
                          type: integer
                          example: 47
                        customerName:
                          type: string
                          example: "Acme Logistics"
        "400":
          description: Failed to fetch station dropdown data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to fetch station dropdown data"
                  message:
                    type: string
                    example: "Database connection error"
  /api/maintenance/customer/customer-dropdown:
    get:
      tags:
        - Customer
      summary: Autocomplete customer dropdown
      description: >
        Provides a list of active customers for use in an autocomplete dropdown.
        If a search value is provided, results are filtered by customer name
        (case-insensitive substring match). If no search is provided, all active
        customers are returned.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search string used to filter customers by name
      responses:
        "200":
          description: List of customers matching the search criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerDropdownResponse"
              examples:
                success:
                  summary: Example autocomplete response
                  value:
                    success: true
                    data:
                      - id: 101
                        name: "Acme Logistics"
                      - id: 102
                        name: "Beta Transport"
        "400":
          description: Invalid request or error fetching customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              examples:
                error:
                  summary: Example error response
                  value:
                    success: false
                    message: "Failed to fetch dropdown data"

  /api/maintenance/customer/station-dropdown:
    get:
      tags:
        - Customer
      summary: Autocomplete station dropdown
      description: >
        Provides a list of active customers for use in an autocomplete dropdown.
        If a search value is provided, results are filtered by customer name
        (case-insensitive substring match). If no search is provided, all active
        customers are returned.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: customerId
          required: true
          schema:
            type: number
          description: Customer Id
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search string used to filter customers by name
      responses:
        "200":
          description: List of customers matching the search criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerDropdownResponse"
              examples:
                success:
                  summary: Example autocomplete response
                  value:
                    success: true
                    data:
                      - id: 101
                        name: "Acme Logistics"
                      - id: 102
                        name: "Beta Transport"
        "400":
          description: Invalid request or error fetching customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              examples:
                error:
                  summary: Example error response
                  value:
                    success: false
                    message: "Failed to fetch dropdown data"
