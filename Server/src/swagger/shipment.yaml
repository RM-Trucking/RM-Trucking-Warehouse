openapi: 3.0.0
info:
  title: Warehouse Shipment API
  version: 1.0.0
  description: Create, update, and list warehouse shipment records with containers and receipts.

tags:
  - name: Shipments
    description: Warehouse shipment CRUD operations

paths:
  /api/shipment:
    get:
      tags:
        - Shipments
      summary: List warehouse shipments
      description: Returns a paginated list of warehouse shipments with related containers and receipts.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: searchTerm
          schema:
            type: string
          description: Optional search term for barcode or air bill number.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
        - in: query
          name: scanned
          schema:
            type: boolean
          description: Filter shipments where freight has been fully scanned. `true` => `isScanned = 'Y'`.
        - in: query
          name: pickup
          schema:
            type: boolean
          description: Filter shipments with pickup entry. `true` => `pickupEntry = 'Y'`.
        - in: query
          name: shipped
          schema:
            type: boolean
          description: Filter shipments that have been shipped. `true` => `isShipped = 'Y'`.
        - in: query
          name: request
          schema:
            type: boolean
          description: Filter shipments with `completeStatus = 'REQUESTED'` when `true`.
      responses:
        "200":
          description: Shipment list retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentListResponse"
    post:
      tags:
        - Shipments
      summary: Create warehouse shipment
      description: Creates a warehouse shipment and optionally links containers and receipts.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShipmentRequest"
      responses:
        "201":
          description: Shipment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Missing required fields
        "500":
          description: Server error

  /api/shipment/{shipmentId}/receipts/{receiptId}:
    put:
      tags:
        - Shipments
      summary: Add a warehouse receipt to a shipment
      description: Links a warehouse receipt to a shipment and changes the receipt status to `PREPARED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Warehouse receipt added to shipment successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Invalid IDs, shipment or receipt not found, or receipt already linked
        "500":
          description: Server error

    delete:
      tags:
        - Shipments
      summary: Remove a warehouse receipt from a shipment
      description: Unlinks a warehouse receipt from a shipment and changes the receipt status to `ON_HAND`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Warehouse receipt removed from shipment successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Invalid IDs, shipment not found, or receipt is not linked to the shipment
        "500":
          description: Server error

  /api/shipment/sign-off:
    post:
      tags:
        - Shipments
      summary: Sign off shipment
      description: Validates all warehouse receipts are fully scanned and marks the shipment as shipped.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipmentId
              properties:
                shipmentId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Shipment signed off successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Validation error or missing fields (e.g., unscanned receipts)
        "404":
          description: Shipment not found
        "500":
          description: Server error

  /api/shipment/split-approval:
    post:
      tags:
        - Shipments
      summary: Approve shipment split
      description: Approves the splitting of a shipment and returns the updated shipment record.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipmentId
              properties:
                shipmentId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Shipment split approved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Validation error (e.g., missing shipmentId)
        "404":
          description: Shipment not found
        "500":
          description: Server error

  /api/shipment/complete:
    post:
      tags:
        - Shipments
      summary: Request shipment completion
      description: Checks linked warehouse receipts for partial scans and sets the shipment `completeStatus` to `REQUESTED` when any receipt is partially scanned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipmentId
              properties:
                shipmentId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Shipment completion requested successfully (or no action required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Validation error (e.g., missing shipmentId)
        "404":
          description: Shipment not found
        "500":
          description: Server error

  /api/shipment/revoke-completion:
    post:
      tags:
        - Shipments
      summary: Revoke shipment completion
      description: Reopens a shipment by resetting `completeStatus` to `IDEAL` and `isShipped` to `N`. Receipt associations and freight scan history are preserved so the shipment can be reassigned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipmentId
              properties:
                shipmentId:
                  type: integer
                  minimum: 1
                  example: 1
      responses:
        "200":
          description: Shipment completion revoked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Invalid shipment ID or validation error
        "404":
          description: Shipment not found
        "500":
          description: Server error

  /api/shipment/scan-freight:
    get:
      tags:
        - Shipments
      summary: Scan freight for a shipment
      description: Marks a shipment freight as scanned using the provided barcode value.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
          description: Shipment ID to scan.
        - in: query
          name: barcodeValue
          required: true
          schema:
            type: string
          description: Barcode value scanned for the freight.
      responses:
        "200":
          description: Freight scanned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Freight scanned successfully
        "400":
          description: Missing shipment id or barcode value
        "500":
          description: Server error

  /api/shipment/unscan-freight:
    get:
      tags:
        - Shipments
      summary: Un-scan freight for a shipment
      description: Marks a shipment freight as un-scanned using the provided barcode value.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
          description: Shipment ID to un-scan.
        - in: query
          name: barcodeValue
          required: true
          schema:
            type: string
          description: "Barcode value scanned for the freight (format: receiptNumber-freightBarcodeValue)."
      responses:
        "200":
          description: Freight un-scanned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Freight un-scanned successfully
        "400":
          description: Missing shipment id or barcode value or validation error
        "500":
          description: Server error

  /api/shipment/{id}/for-pickup:
    get:
      tags:
        - Shipments
      summary: Get shipment pickup details by ID
      description: Retrieves the shipment entry, customer/station, and consignee details required for pickup entry.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID of the shipment.
      responses:
        "200":
          description: Shipment pickup details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentPickupResponse"
        "400":
          description: Shipment ID is required or invalid
        "404":
          description: Shipment not found
        "500":
          description: Server error

  /api/shipment/pickup-entry:
    post:
      tags:
        - Shipments
      summary: Create shipment pickup entry
      description: Stores pickup-entry details and marks the shipment as having a pickup entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentPickupEntryRequest"
      responses:
        "201":
          description: Shipment pickup entry created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        "400":
          description: Invalid or missing pickup-entry fields
        "404":
          description: Shipment not found
        "500":
          description: Server error

  /api/shipment/{id}:
    get:
      tags:
        - Shipments
      summary: Get warehouse shipment by ID
      description: Retrieves a shipment along with its containers and receipts.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shipment retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "404":
          description: Shipment not found
    put:
      tags:
        - Shipments
      summary: Update warehouse shipment
      description: Updates the shipment and replaces the related containers and receipts when supplied.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShipmentRequest"
      responses:
        "200":
          description: Shipment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          description: Invalid shipment id
        "500":
          description: Server error

components:
  parameters:
    ShipmentId:
      in: path
      name: shipmentId
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID of the shipment.
    ReceiptId:
      in: path
      name: receiptId
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID of the warehouse receipt.
  schemas:
    ShipmentContainer:
      type: object
      properties:
        container:
          type: string
          example: "CNT-1001"
    ShipmentReceipt:
      type: object
      properties:
        receiptId:
          type: integer
          example: 123456
    WarehouseShipment:
      type: object
      properties:
        shipmentId:
          type: integer
          example: 1
        shipmentType:
          type: string
          enum: [AIR, OCEAN_FCL, OCEAN_LCL]
        barcodeNumber:
          type: string
          example: "SHIP-1001"
        customerId:
          type: integer
          example: 10
        stationId:
          type: integer
          example: 20
        consigneeId:
          type: integer
          example: 30
        airBillNumber:
          type: string
          example: "AB-001"
        booking:
          type: string
          example: "BK-2026"
        customerRefNumber:
          type: string
          example: "CR-001"
        additionalRefNumber:
          type: string
          example: "AR-001"
        pieces:
          type: integer
          example: 5
        weight:
          type: number
          example: 250.5
        instructions:
          type: string
          example: "Fragile"
        createdBy:
          type: integer
          example: 100
        updatedBy:
          type: integer
          example: 100
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentContainer"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentReceipt"
    CreateShipmentRequest:
      type: object
      required:
        - shipmentType
        - barcodeNumber
        - customerId
        - stationId
        - consigneeId
        - pieces
        - weight
      properties:
        shipmentType:
          type: string
          enum: [AIR, OCEAN_FCL, OCEAN_LCL]
        barcodeNumber:
          type: string
        customerId:
          type: integer
        stationId:
          type: integer
        consigneeId:
          type: integer
        airBillNumber:
          type: string
        booking:
          type: string
        customerRefNumber:
          type: string
        additionalRefNumber:
          type: string
        pieces:
          type: integer
        weight:
          type: number
        instructions:
          type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentContainer"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentReceipt"
    UpdateShipmentRequest:
      type: object
      properties:
        shipmentType:
          type: string
          enum: [AIR, OCEAN_FCL, OCEAN_LCL]
        barcodeNumber:
          type: string
        customerId:
          type: integer
        stationId:
          type: integer
        consigneeId:
          type: integer
        airBillNumber:
          type: string
        booking:
          type: string
        customerRefNumber:
          type: string
        additionalRefNumber:
          type: string
        pieces:
          type: integer
        weight:
          type: number
        instructions:
          type: string
        isCanceled:
          type: string
          enum: [Y, N]
        isShipped:
          type: string
          enum: [Y, N]
        isScanned:
          type: string
          enum: [Y, N]
        pickupEntry:
          type: string
          enum: [Y, N]
        pickupEntryNumber:
          type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentContainer"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentReceipt"
    ShipmentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/WarehouseShipment"
    ShipmentPickupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/ShipmentPickupDetails"
    ShipmentPickupDetails:
      type: object
      required:
        - entryDetails
        - customerDetails
        - shipmentDetails
      properties:
        entryDetails:
          $ref: "#/components/schemas/ShipmentPickupEntryDetails"
        customerDetails:
          $ref: "#/components/schemas/ShipmentPickupCustomerDetails"
        shipmentDetails:
          $ref: "#/components/schemas/ShipmentPickupShipmentDetails"
    ShipmentPickupEntryRequest:
      type: object
      required:
        - shipmentId
        - barcodeNumber
        - pickupDate
        - contactName
        - customerId
        - stationId
        - pieces
        - weight
        - readyDate
        - closeDate
        - loDate
      properties:
        shipmentId:
          type: integer
          minimum: 1
        barcodeNumber:
          type: string
        pickupDate:
          type: string
          format: date
        contactName:
          type: string
        contactPhoneNumber:
          type: string
        customerId:
          type: integer
        customerName:
          type: string
        stationId:
          type: integer
        stationName:
          type: string
        billTo:
          type: string
        stationAddressLine1:
          type: string
        stationAddressLine2:
          type: string
        stationCity:
          type: string
        stationState:
          type: string
        stationZipCode:
          type: string
        stationPhoneNumber:
          type: string
        airlineCode:
          type: string
        airBillNumber:
          type: string
        hazmat:
          type: string
          enum: [Y, N]
        pieces:
          type: number
        weight:
          type: number
        readyTime:
          type: string
        readyDate:
          type: string
          format: date
        closeTime:
          type: string
        closeDate:
          type: string
          format: date
        loTime:
          type: string
        loDate:
          type: string
          format: date
    ShipmentPickupEntryDetails:
      type: object
      properties:
        barcodeNumber:
          type: string
          example: "SHIP-1001"
        shipmentType:
          type: string
          enum: [AIR, OCEAN_FCL, OCEAN_LCL]
        booking:
          type: string
          example: "BK-2026"
        customerRefNumber:
          type: string
          example: "CR-001"
        additionalRefNumber:
          type: string
          example: "AR-001"
    ShipmentPickupCustomerDetails:
      type: object
      properties:
        customerId:
          type: integer
          example: 10
        customerName:
          type: string
          example: "Example Customer"
        stationId:
          type: integer
          example: 20
        stationName:
          type: string
          example: "Toronto Station"
        stationRMAccountNumber:
          type: string
          example: "RM-12345"
        stationAddressLine1:
          type: string
        stationAddressLine2:
          type: string
        stationCity:
          type: string
        stationState:
          type: string
        stationZip:
          type: string
        stationContactName:
          type: string
        stationPhoneNumber:
          type: string
    ShipmentPickupShipmentDetails:
      type: object
      properties:
        consigneeId:
          type: integer
          example: 30
        airlineCode:
          type: string
          example: "AC"
        airBillNumber:
          type: string
          example: "AB-001"
        pieces:
          type: integer
          example: 5
        weight:
          type: number
          example: 250.5
    ShipmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseShipment"
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
