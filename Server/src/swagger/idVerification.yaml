openapi: 3.0.0
info:
  title: ID Verification API
  version: 1.0.0
  description: API documentation for ID Verification module - Driver check-in and verification form creation

tags:
  - name: Drivers
    description: Driver check-in and management operations
  - name: Verification
    description: ID Verification form operations with stepper workflow

paths:
  /api/id-verification/drivers:
    post:
      tags:
        - Drivers
      summary: Create driver check-in record
      description: Register a new driver with name and signature. Returns driverId for subsequent verification forms.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriverRequest"
      responses:
        "201":
          description: Driver created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Driver created successfully"
                  data:
                    $ref: "#/components/schemas/DriverResponse"
        "400":
          description: Missing required field - Driver name is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/id-verification/drivers/{driverId}:
    get:
      tags:
        - Drivers
      summary: Get driver details by ID
      description: Retrieve driver information including name and signature for verification form display
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: driverId
          schema:
            type: string
          required: true
          description: Unique driver identifier (bigint)
      responses:
        "200":
          description: Driver found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/DriverDetail"
        "400":
          description: Driver ID is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/id-verification:
    post:
      tags:
        - Verification
      summary: Create ID verification form (stepper flow)
      description: |
        Creates ID verification with multiple freight details.
        This endpoint groups freight details by customer/station and creates:
        - One ID_Verification per customer/station combination
        - Multiple ProDetails under each verification
        - Warehouse receipts (temp + main) for each freight item

        IMPORTANT: Validates duplicate carrier + PRO number combinations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationRequest"
      responses:
        "201":
          description: ID Verification created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "ID Verification created successfully"
                  data:
                    type: object
                    properties:
                      verificationIds:
                        type: array
                        items:
                          type: string
                        example: ["100000001", "100000002"]
        "400":
          description: Missing required fields or duplicate carrier/PRO found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Verification
      summary: List ID verifications with pagination
      description: Retrieve all ID verifications with optional pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
          description: Number of records per page
      responses:
        "200":
          description: Verifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VerificationDetail"
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/id-verification/{verificationId}:
    get:
      tags:
        - Verification
      summary: Get verification details with all related data
      description: Retrieve complete verification including driver info, pro details, and warehouse receipts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: verificationId
          schema:
            type: string
          required: true
          description: Unique verification identifier (bigint)
      responses:
        "200":
          description: Verification found successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/VerificationWithAllData"
        "400":
          description: Verification ID is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Verification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateDriverRequest:
      type: object
      required:
        - driverName
      properties:
        driverName:
          type: string
          example: "John Doe"
          description: Full name of the driver
        signaturePath:
          type: string
          nullable: true
          example: "/signatures/john-doe-sig.png"
          description: Path or encrypted signature value

    DriverResponse:
      type: object
      properties:
        driverId:
          type: string
          example: "100000001"
          description: Unique driver identifier

    DriverDetail:
      type: object
      properties:
        driverId:
          type: string
          example: "100000001"
        driverName:
          type: string
          example: "John Doe"
        signaturePath:
          type: string
          nullable: true
          example: "/signatures/john-doe-sig.png"

    CreateVerificationRequest:
      type: object
      required:
        - header
        - freightDetails
      properties:
        header:
          $ref: "#/components/schemas/VerificationHeader"
        freightDetails:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FreightDetail"

    VerificationHeader:
      type: object
      required:
        - carrierId
        - firstIdType
        - driverName
        - driverSignature
        - verifiedByEmployee
      properties:
        carrierId:
          type: integer
          example: 52
          description: Carrier module ID
        doorNo:
          type: string
          nullable: true
          example: "DOOR-001"
        firstIdType:
          type: string
          enum: [GOVERNMENT_ISSUED, COMPANY_ISSUED]
          example: "GOVERNMENT_ISSUED"
          description: Type of first ID reviewed
        firstIdPhotoMatch:
          type: string
          enum: [Y, N]
          example: "Y"
          description: Whether photo matches on first ID
        secondIdType:
          type: string
          nullable: true
          example: "NA"
          description: Type of second ID reviewed (typically NA)
        secondIdPhotoMatch:
          type: string
          enum: [Y, N]
          example: "N"
          description: Whether photo matches on second ID (typically false/0)
        driverName:
          type: string
          example: "John Doe"
          description: Name of the driver
        driverSignature:
          type: string
          example: "base64-encoded-signature-value"
          description: Base64-encoded signature of the driver
        verifiedByEmployee:
          type: string
          example: "Jane Smith"
          description: Name of the employee who verified the ID

    FreightDetail:
      type: object
      required:
        - customerId
        - stationId
        - proNumber
        - pieces
        - weight
        - shipper
      properties:
        customerId:
          type: integer
          example: 51
          description: Customer module ID
        stationId:
          type: integer
          example: 93
          description: Station module ID
        proDetailId:
          type: integer
          example: 0
          description: Optional PRO detail ID if linked to a PRO record
        proNumber:
          type: string
          example: "PRO123456"
          description: PRO number for the freight item (used for validation and receipt creation)
        pieces:
          type: integer
          example: 50
          description: Number of pieces
        weight:
          type: integer
          example: 5000
          description: Total weight in pounds/kg
        shipper:
          type: string
          example: "ABC Logistics"
          description: Shipper name (also used as PRO identifier for validation)
        toEmails:
          type: array
          items:
            type: string
          example: ["demo1@gmail.com", "demo2@gmail.com"]
          description: Optional list of email addresses to send freight details to

    VerificationDetail:
      type: object
      properties:
        verificationId:
          type: string
          example: "100000001"
        carrierId:
          type: integer
          example: 1
        doorNo:
          type: string
          nullable: true
        firstIdType:
          type: string
          example: "GOVERNMENT_ISSUED"
        firstIdPhotoMatch:
          type: string
          enum: [Y, N]
        driverId:
          type: string
        verifiedByEmployee:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer

    VerificationWithAllData:
      type: object
      properties:
        verificationId:
          type: string
          example: "100000001"
        carrierId:
          type: integer
        doorNo:
          type: string
          nullable: true
        firstIdType:
          type: string
        firstIdPhotoMatch:
          type: string
        secondIdType:
          type: string
        secondIdPhotoMatch:
          type: string
        driverId:
          type: string
        verifiedByEmployee:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
        driver:
          $ref: "#/components/schemas/DriverDetail"
        proDetails:
          type: array
          items:
            type: object
            properties:
              proDetailId:
                type: string
              customerId:
                type: integer
              stationId:
                type: integer
              pieces:
                type: integer
              weight:
                type: integer
              shipper:
                type: string
        receipts:
          type: array
          items:
            type: object
            properties:
              receiptId:
                type: string
              receiptNumber:
                type: string
              status:
                type: string

    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message details"
