openapi: 3.0.0
info:
  title: Carrier API
  version: 1.0.0
  description: API documentation for Carrier dropdown endpoints

tags:
  - name: Carrier
    description: Operations related to customer data

paths:
  /api/maintenance/carrier:
    post:
      tags:
        - Carrier
      summary: Create a new carrier
      description: Creates a new carrier with the provided information.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - carrierName
              properties:
                carrierName:
                  type: string
                  example: "Blue Star Logistics"
                  description: Name of the carrier (required)
                corporatePhoneNumber:
                  type: string
                  example: "+1-800-123-4567"
                  description: Corporate phone number (optional)
      responses:
        "201":
          description: Carrier created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Carrier created successfully"
                  data:
                    type: object
                    properties:
                      carrier:
                        type: object
                        properties:
                          carrierId:
                            type: integer
                            example: 1
                          carrierName:
                            type: string
                            example: "Blue Star Logistics"
        "400":
          description: Failed to create carrier
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Carrier name is required"

  /api/maintenance/carrier/dropdown:
    get:
      tags:
        - Carrier
      summary: Get carriers for dropdown
      description: Returns all carriers with status Active or Incomplete, filtered by search term.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Search term to filter carrier names (case-insensitive).
      responses:
        "200":
          description: Successful response with carrier dropdown data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        carrierId:
                          type: integer
                          example: 12
                        carrierName:
                          type: string
                          example: "Blue Star Logistics"
        "400":
          description: Failed to fetch carrier dropdown data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Database connection error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
