openapi: 3.0.0
info:
  title: Enroute API
  version: 1.0.0
  description: API documentation for Enroute module endpoints

tags:
  - name: Enroute
    description: Operations related to enroute forms and PRO details

paths:
  /api/enroute:
    post:
      tags:
        - Enroute
      summary: Create a new enroute with multiple PROs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnroutePayload"
      responses:
        "201":
          description: Enroute created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  enrouteId:
                    type: integer
                    example: 101
        "400":
          description: Missing required fields
        "500":
          description: Server error

    get:
      tags:
        - Enroute
      summary: List all enroutes with PROs
      description: >
        Returns a list of enroutes with associated PRO details.  
        Supports optional search by carrier name, customer name, or station name
        using a single `searchTerm` query parameter.  
        Supports pagination using `page` and `pageSize` query parameters.  
        If `searchTerm` is provided, results will include enroutes where any of
        these fields match the term (case-insensitive).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: searchTerm
          schema:
            type: string
          required: false
          description: >
            A search term to filter enroutes by carrier name, customer name, or
            station name. Example: `searchTerm=Chicago`
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: The page number to retrieve (default is 1).
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
          required: false
          description: Number of records per page (default is 10).
      responses:
        "200":
          description: Successful response with enroutes and PROs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnrouteWithPros"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of enroutes matching the filter
                        example: 125
                      page:
                        type: integer
                        description: Current page number
                        example: 2
                      pageSize:
                        type: integer
                        description: Number of records per page
                        example: 10
        "500":
          description: Server error

  /api/enroute/verify:
    get:
      tags:
        - Enroute
      summary: Verify PRO by carrier and proNumber
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: carrierId
          schema:
            type: integer
          required: true
          description: Carrier ID
        - in: query
          name: proNumber
          schema:
            type: string
          required: true
          description: PRO number to verify
      responses:
        "200":
          description: PRO verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/VerifyProResponse"
        "400":
          description: Missing required query parameters
        "404":
          description: PRO not found for given carrier
        "500":
          description: Server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateProPayload:
      type: object
      properties:
        proNumber:
          type: string
          example: "PRO12345"
        pieces:
          type: integer
          example: 10
        weight:
          type: number
          format: float
          example: 250.5
        shipper:
          type: string
          example: "ABC Shippers"

    CreateEnroutePayload:
      type: object
      required:
        - carrierId
        - customerId
        - stationId
        - toEmails
        - pros
      properties:
        carrierId:
          type: integer
          example: 12
        customerId:
          type: integer
          example: 47
        stationId:
          type: integer
          example: 5
        estimatedDate:
          type: string
          format: date
          example: "2026-03-30"
        shippedDate:
          type: string
          format: date
          example: "2026-03-28"
        toEmails:
          type: array
          items:
            type: string
            format: email
          example: ["demo@gmail.com", "demo1@gmail.com"]
        pros:
          type: array
          items:
            $ref: "#/components/schemas/CreateProPayload"

    EnrouteProDetail:
      type: object
      properties:
        proDetailId:
          type: integer
          example: 201
        proNumber:
          type: string
          example: "PRO12345"
        pieces:
          type: integer
          example: 10
        weight:
          type: number
          format: float
          example: 250.5
        shipper:
          type: string
          example: "ABC Shippers"
        activeStatus:
          type: string
          enum: [Y, N]
          example: "Y"

    EnrouteWithPros:
      type: object
      properties:
        enrouteId:
          type: integer
          example: 101
        estimatedDate:
          type: string
          format: date
          example: "2026-03-30"
        shippedDate:
          type: string
          format: date
          example: "2026-03-28"
        carrierName:
          type: string
          example: "Blue Star Logistics"
        customerName:
          type: string
          example: "Acme Corporation"
        stationName:
          type: string
          example: "Mumbai Station"
        pros:
          type: array
          items:
            $ref: "#/components/schemas/EnrouteProDetail"

    VerifyProResponse:
      type: object
      properties:
        proDetailId:
          type: integer
          example: 201
        proNumber:
          type: string
          example: "PRO12345"
        pieces:
          type: integer
          example: 10
        weight:
          type: number
          format: float
          example: 250.5
        shipper:
          type: string
          example: "ABC Shippers"
        activeStatus:
          type: string
          enum: [Y, N]
          example: "Y"
        enrouteId:
          type: integer
          example: 101
        carrierId:
          type: integer
          example: 12
        carrierName:
          type: string
          example: "Blue Star Logistics"
        customerId:
          type: integer
          example: 47
        customerName:
          type: string
          example: "Acme Corporation"
        stationId:
          type: integer
          example: 5
        stationName:
          type: string
          example: "Mumbai Station"
