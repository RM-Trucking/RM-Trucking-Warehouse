openapi: 3.0.0
info:
  title: Enroute API
  version: 1.0.0
  description: API documentation for Enroute module endpoints

tags:
  - name: Enroute
    description: Operations related to enroute forms and PRO details

paths:
  /api/enroute:
    post:
      tags:
        - Enroute
      summary: Create a new enroute with multiple PROs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnroutePayload"
      responses:
        "201":
          description: Enroute created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  enrouteId:
                    type: integer
                    example: 101
        "400":
          description: Missing required fields
        "500":
          description: Server error

    get:
      tags:
        - Enroute
      summary: List all enroutes with PROs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response with enroutes and PROs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnrouteWithPros"
        "500":
          description: Server error

  /api/enroute/verify:
    get:
      tags:
        - Enroute
      summary: Verify PRO by carrier and proNumber
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: carrierId
          schema:
            type: integer
          required: true
          description: Carrier ID
        - in: query
          name: proNumber
          schema:
            type: string
          required: true
          description: PRO number to verify
      responses:
        "200":
          description: PRO verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/VerifyProResponse"
        "400":
          description: Missing required query parameters
        "404":
          description: PRO not found for given carrier
        "500":
          description: Server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateProPayload:
      type: object
      properties:
        proNumber:
          type: string
          example: "PRO12345"
        pieces:
          type: integer
          example: 10
        weight:
          type: number
          format: float
          example: 250.5
        shipper:
          type: string
          example: "ABC Shippers"
        activeStatus:
          type: string
          enum: [Y, N]
          example: "Y"

    CreateEnroutePayload:
      type: object
      required:
        - carrierId
        - customerId
        - stationId
        - createdBy
        - pros
      properties:
        carrierId:
          type: integer
          example: 12
        customerId:
          type: integer
          example: 47
        stationId:
          type: integer
          example: 5
        estimatedDate:
          type: string
          format: date
          example: "2026-03-30"
        shippedDate:
          type: string
          format: date
          example: "2026-03-28"
        createdBy:
          type: string
          example: "systemUser"
        pros:
          type: array
          items:
            $ref: "#/components/schemas/CreateProPayload"

    EnrouteProDetail:
      type: object
      properties:
        proDetailId:
          type: integer
          example: 201
        proNumber:
          type: string
          example: "PRO12345"
        pieces:
          type: integer
          example: 10
        weight:
          type: number
          format: float
          example: 250.5
        shipper:
          type: string
          example: "ABC Shippers"
        activeStatus:
          type: string
          enum: [Y, N]
          example: "Y"

    EnrouteWithPros:
      type: object
      properties:
        enrouteId:
          type: integer
          example: 101
        estimatedDate:
          type: string
          format: date
          example: "2026-03-30"
        shippedDate:
          type: string
          format: date
          example: "2026-03-28"
        carrierName:
          type: string
          example: "Blue Star Logistics"
        customerName:
          type: string
          example: "Acme Corporation"
        stationName:
          type: string
          example: "Mumbai Station"
        pros:
          type: array
          items:
            $ref: "#/components/schemas/EnrouteProDetail"

    VerifyProResponse:
      type: object
      properties:
        proDetailId:
          type: integer
          example: 201
        proNumber:
          type: string
          example: "PRO12345"
        pieces:
          type: integer
          example: 10
        weight:
          type: number
          format: float
          example: 250.5
        shipper:
          type: string
          example: "ABC Shippers"
        activeStatus:
          type: string
          enum: [Y, N]
          example: "Y"
        enrouteId:
          type: integer
          example: 101
        carrierId:
          type: integer
          example: 12
        carrierName:
          type: string
          example: "Blue Star Logistics"
        customerId:
          type: integer
          example: 47
        customerName:
          type: string
          example: "Acme Corporation"
        stationId:
          type: integer
          example: 5
        stationName:
          type: string
          example: "Mumbai Station"
