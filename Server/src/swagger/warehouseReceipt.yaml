    BatchProcessWarehouseReceipts:
      type: object
      required:
        - receipts
      properties:
        receipts:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - receipt
              - freightDetails
            properties:
              receipt:
                type: object
                description: "Receipt data: if receiptId present = UPDATE, if absent = CREATE"
                properties:
                  receiptId:
                    type: integer
                    example: 10
                    description: "Optional: If present, receipt will be updated; if absent, new receipt will be created"
                  receiptNumber:
                    type: integer
                    example: 100000015
                    description: "Receipt number for reference"
                  receivedBy:
                    type: string
                    nullable: true
                    example: "John Warehouse"
                  location:
                    type: string
                    nullable: true
                    example: "Warehouse A, Zone 1"
                  shipper:
                    type: string
                    example: "ABC Logistics Inc"
                  customerId:
                    type: integer
                    example: 51
                  stationId:
                    type: integer
                    example: 93
                  verificationId:
                    type: integer
                    example: 100000021
                  carrierId:
                    type: integer
                    example: 52
                  piecesInland:
                    type: integer
                    nullable: true
                    example: 50
                  weightInland:
                    type: number
                    nullable: true
                    example: 5000
                  reWeight:
                    type: number
                    nullable: true
                    example: 5050
                  proNumber:
                    type: string
                    nullable: true
                    example: "PRO-2026-001"
                  invoiceNumber:
                    type: string
                    nullable: true
                  poNumber:
                    type: string
                    nullable: true
                  customerRefNumber:
                    type: string
                    nullable: true
                  freightCondition:
                    type: string
                    nullable: true
                  handlingDescription:
                    type: string
                    nullable: true
                  destination:
                    type: string
                    nullable: true
                  originalDgd:
                    type: string
                    nullable: true
                  unNumber:
                    type: string
                    nullable: true
                  class:
                    type: string
                    nullable: true
                  packageId:
                    type: string
                    nullable: true
                  properShippingName:
                    type: string
                    nullable: true
                  hazardousDescription:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum: [INITIATE, IN_PROGRESS, COMPLETED, HOLD]
                    example: "INITIATE"
                  withSkid:
                    type: string
                    enum: ["Y", "N"]
                    example: "Y"
                  bandedSkid:
                    type: string
                    enum: ["Y", "N"]
                    example: "Y"
                  shrinkWrappedSkid:
                    type: string
                    enum: ["Y", "N"]
                    example: "Y"
                  shtIppcSkid:
                    type: string
                    enum: ["Y", "N"]
                    example: "Y"
                  plasticSkid:
                    type: string
                    enum: ["Y", "N"]
                    example: "Y"
                  hazMat:
                    type: string
                    enum: ["Y", "N"]
                    example: "Y"
                  labelCount:
                    type: integer
                    nullable: true
                    example: 0
              freightDetails:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/CreateFreightDetail"
                description: "Array of freight items. For UPDATE, existing items are deleted and replaced with these"
          description: "Array of receipt objects to process. Each has receipt (with receiptNumber and optional receiptId) and freightDetails. Presence of receiptId determines UPDATE vs CREATE. receiptNumber is required for reference/audit in both operations."

    BatchReceiptUpdate:
      description: "DEPRECATED - See BatchProcessWarehouseReceipts for current structure"
      type: object

