openapi: 3.0.0
info:
  title: Warehouse Receipt API
  version: 1.0.0
  description: API documentation for Warehouse Receipt module - Receipt management and status change tracking. Audit logs are automatically created when warehouse receipt status changes (INITIATE → IN_PROGRESS → COMPLETED/HOLD). Receipts are created automatically when ID verifications are processed.

tags:
  - name: Receipts
    description: Warehouse receipt CRUD operations

paths:
  /api/warehouse-receipt/temp:
    post:
      tags:
        - Receipts
      summary: Create temporary warehouse receipt
      description: "Create a temporary warehouse receipt that will be used as a base for the actual receipt. Returns all temporary receipt data.\n\nAuto-generated fields:\n- receiptNumber (from sequence)\n- receiptDate (current timestamp)\n- createdBy (from authenticated user)\n- createdAt (current timestamp)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemporaryWarehouseReceipt"
            example:
              verificationId: 100000033
              shipper: "ABC Logistics Inc"
              customerId: 51
              stationId: 93
              carrierId: 52
              status: "INITIATE"
              receivedBy: "John Warehouse"
              location: "Warehouse A, Zone 1"
              destination: "Customer Final Destination"
              proNumber: "PRO1234511"
              packageId: "PKG-001"
      responses:
        "201":
          description: Temporary warehouse receipt created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Temporary warehouse receipt created successfully"
                  data:
                    $ref: "#/components/schemas/WarehouseReceiptTemp"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/batch:
    post:
      tags:
        - Receipts
      summary: Batch process warehouse receipts (update and/or create with optional image uploads)
      description: "Process multiple warehouse receipts in a single batch transaction. Supports both JSON and multipart/form-data with images.\n\n**Send as JSON** for batch operations without images.\n\n**Send as multipart/form-data** for batch operations with image uploads:\n- Field: `batchData` (JSON string without images)\n- Files: Image files with field names: `freight-{receiptIndex}-{freightIndex}-{imageIndex}`\n  - Example: `freight-0-0-0` → receipts[0].freightDetails[0].images[0]\n  - Example: `freight-0-1-0` → receipts[0].freightDetails[1].images[0]\n\nArray structure: Each item must have `receipt` (object) and `freightDetails` (array).\n\n**System-managed fields** (auto-handled, do NOT provide in request):\n- createdAt, createdBy: auto-set on creation\n- updatedAt, updatedBy: auto-set on update\n- documentId: auto-generated on creation\n- entityId, noteThreadId: auto-created on creation\n\n**Required fields in payload:**\n- receiptId: required for UPDATE operations\n- receiptNumber: required for all operations (for reference/audit)\n- All updateable receipt fields and freightDetails array\n\n**UPDATE Operation** (receipt has receiptId):\n- Only updateable fields are applied to the receipt\n- All freight items are deleted and replaced with new ones from freightDetails\n- Automatically sets updatedBy to authenticated user\n- Automatically sets updatedAt to current timestamp\n\n**CREATE Operation** (receipt has no receiptId):\n- Creates new receipt with provided receipt data (including receiptNumber)\n- Creates freight items from freightDetails array\n- System fields are auto-generated and managed by backend\n\n**Image Upload**:\n- Optional: send images via multipart/form-data\n- Images stored in `uploads/freight-images/`\n- Supported formats: JPEG, PNG, GIF, WebP (Max 10MB per file)\n- Images linked to freight via freightId in Warehouse_Receipt_Freight_Images table\n- Response includes image paths and metadata for each freight item\n\nAll operations are atomic - either all succeed or all rollback."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchProcessWarehouseReceipts"
            example:
              receipts:
                - receipt:
                    receiptId: 25
                    receiptNumber: 100000031
                    receivedBy: null
                    location: null
                    shipper: "ABC Logistics Inc"
                    customerId: 51
                    stationId: 93
                    verificationId: 100000033
                    carrierId: 52
                    piecesInland: 50
                    weightInland: 5000
                    reWeight: null
                    proNumber: "PRO1234511"
                    invoiceNumber: null
                    poNumber: null
                    customerRefNumber: null
                    freightCondition: "Y"
                    documents: "Y"
                    handlingDescription: null
                    destination: null
                    originalDgd: null
                    unNumber: ["123", "333", "3333"]
                    class: ["hello", "hi", "Welcome", "next", "wrap", "cook"]
                    packageId: null
                    properShippingName: null
                    hazardousDescription: null
                    notes: "Handle with care"
                    status: "INITIATE"
                    receiptType: "Regular"
                    bandedSkid: "Y"
                    shrinkWrappedSkid: "Y"
                    shtIppcSkid: "Y"
                    plasticSkid: "Y"
                    hazMat: "Y"
                    labelCount: 0
                    toEmails: ["user@example.com"]
                    cubicMeter: 100
                    driverName: "John Doe"
                  freightDetails:
                    - pieces: 20
                      type: "Box"
                      weight: 2000
                      length: 10
                      width: 10
                      height: 10
                      cubicMeter: 20
                    - pieces: 30
                      type: "Pallet"
                      weight: 3000
                      length: 48
                      width: 40
                      height: 60
                      cubicMeter: 80
                - receipt:
                    receiptNumber: 100000033
                    receivedBy: null
                    location: null
                    shipper: "Global Freight Ltd"
                    customerId: 51
                    stationId: 93
                    verificationId: 100000033
                    carrierId: 52
                    piecesInland: 40
                    weightInland: 4200
                    reWeight: null
                    proNumber: "PRO1234511"
                    invoiceNumber: null
                    poNumber: null
                    customerRefNumber: null
                    freightCondition: "Y"
                    documents: "Y"
                    handlingDescription: null
                    destination: null
                    originalDgd: null
                    unNumber: ["123", "333", "3333"]
                    class: ["hello", "hi", "Welcome", "next", "wrap", "cook"]
                    packageId: null
                    properShippingName: null
                    hazardousDescription: null
                    notes: "This is a note for the receipt"
                    status: "INITIATE"
                    receiptType: "Regular"
                    bandedSkid: "Y"
                    shrinkWrappedSkid: "Y"
                    shtIppcSkid: "Y"
                    plasticSkid: "Y"
                    hazMat: "Y"
                    labelCount: 0
                    toEmails: ["user@example.com"]
                    cubicMeter: 100
                    driverName: "John Doe"
                  freightDetails:
                    - pieces: 10
                      type: "Crate"
                      weight: 1200
                      length: 20
                      width: 15
                      height: 12
                      cubicMeter: 3.6
                    - pieces: 30
                      type: "Pallet"
                      weight: 3000
                      length: 48
                      width: 40
                      height: 55
                      cubicMeter: 70
          multipart/form-data:
            schema:
              type: object
              required:
                - batchData
              properties:
                batchData:
                  type: string
                  format: binary
                  description: "JSON string containing batch receipts array (without images). Images are sent as separate files."
                  example: '{"receipts":[{"receipt":{"receiptId":10,"receiptNumber":100000015,...},"freightDetails":[{"pieces":20,"type":"Box",...}]}]}'
                freight-0-0-0:
                  type: string
                  format: binary
                  description: "Image file for receipts[0].freightDetails[0].images[0]"
                freight-0-0-1:
                  type: string
                  format: binary
                  description: "Image file for receipts[0].freightDetails[0].images[1]"
                freight-0-1-0:
                  type: string
                  format: binary
                  description: "Image file for receipts[0].freightDetails[1].images[0]"
      responses:
        "201":
          description: Batch process completed successfully (with or without images)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Batch process completed successfully"
                  filesProcessed:
                    type: integer
                    example: 5
                    description: "Number of image files processed (only present when images uploaded)"
                  data:
                    $ref: "#/components/schemas/BatchProcessResponse"
        "400":
          description: Missing required fields or invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt:
    post:
      tags:
        - Receipts
      summary: Create warehouse receipt with freight info
      description: "Create a warehouse receipt with multiple freight details. Automatically creates associated document record and returns the receipt with all freight items.\n\nAuto-generated fields:\n- receiptNumber (from sequence)\n- documentId (from Warehouse_Receipt_Documents)\n- createdBy (from authenticated user)\n- createdAt (current timestamp)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseReceiptWithFreight"
            example:
              receipt:
                receiptDate: "2026-04-06T10:00:00Z"
                shipper: "ABC Logistics Inc"
                customerId: 51
                stationId: 93
                verificationId: 100000021
                carrierId: 52
                proNumber: "PRO-2026-001"
                piecesInland: 50
                weightInland: 5000
                status: "INITIATE"
                entityId: 1
                noteThreadId: 1
                toEmails: ["user@example.com"]
                cubicMeter: 100
              freightDetails:
                - pieces: 20
                  type: "Box"
                  weight: 2000
                  length: 10
                  width: 10
                  height: 10
                  cubicMeter: 20
                - pieces: 30
                  type: "Pallet"
                  weight: 3000
                  length: 48
                  width: 40
                  height: 60
                  cubicMeter: 80
      responses:
        "201":
          description: Warehouse receipt created successfully with freight info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Warehouse receipt created successfully with freight info"
                  data:
                    $ref: "#/components/schemas/WarehouseReceiptWithFreightResponse"
        "400":
          description: Missing required fields or invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Receipts
      summary: List warehouse receipts with pagination and filters
      description: Retrieve all warehouse receipts with optional filtering by status and carrier
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
          description: Number of records per page
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                INITIATED,
                ON_HAND,
                PREPARED,
                SCANNED,
                SHIPPED,
                REJECTED,
                ARCHIVED,
              ]
          description: Filter by receipt status
        - in: query
          name: receiptNumber
          schema:
            type: integer
          description: Filter by receipt number
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter receipts created after this date (inclusive)
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter receipts created before this date (inclusive)
        - in: query
          name: customerId
          schema:
            type: integer
          description: Filter by customer ID
        - in: query
          name: stationId
          schema:
            type: integer
          description: Filter by station ID
        - in: query
          name: carrierId
          schema:
            type: integer
          description: Filter by carrier ID
        - in: query
          name: location
          schema:
            type: string
          description: Filter by location (partial match)
        - in: query
          name: proNumber
          schema:
            type: string
          description: Filter by PRO number (partial match)
        - in: query
          name: verificationId
          schema:
            type: integer
          description: Filter by ID verification ID
        - in: query
          name: destination
          schema:
            type: string
          description: Filter by destination (partial match)
        - in: query
          name: packageId
          schema:
            type: string
          description: Filter by package ID (partial match)
        - in: query
          name: customerRefNumber
          schema:
            type: string
          description: Filter by customer reference number (partial match)
      responses:
        "200":
          description: Receipts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WarehouseReceipt"
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/{id}:
    get:
      tags:
        - Receipts
      summary: Get warehouse receipt with all details
      description: |
        Retrieve receipt with freight info, rates, and audit logs. Supports lookup by:
        - **Receipt Number** (default): Pass numeric receiptNumber
        - **PRO Number**: Pass PRO number string with `?searchBy=proNumber` query parameter

        Returns receipt details including associated freight items with images, rate information, and audit logs.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Receipt identifier - either numeric receiptNumber (default) or PRO number string (when searchBy=proNumber)
          example: "123"
        - in: query
          name: searchBy
          schema:
            type: string
            enum: [receiptNumber, proNumber]
            default: receiptNumber
          description: |
            Specifies the lookup field:
            - `receiptNumber` (default): id parameter is treated as Receipt Number
            - `proNumber`: id parameter is treated as PRO number string
          example: receiptNumber
      responses:
        "200":
          description: Receipt found successfully with all details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WarehouseReceiptWithDetails"
        "400":
          description: Invalid request - missing id or invalid searchBy parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receipt not found for the provided id and searchBy parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Receipts
      summary: Update warehouse receipt
      description: Update receipt details (location, status, weights, etc). When status changes, an audit log is automatically created to track the change.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Unique receipt identifier (bigint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReceiptRequest"
      responses:
        "200":
          description: Receipt updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Receipt updated successfully"
                  data:
                    $ref: "#/components/schemas/WarehouseReceipt"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/{receiptId}/location:
    patch:
      tags:
        - Receipts
      summary: Update warehouse receipt location
      description: Update only the location field of a warehouse receipt. This is a targeted update for location changes without affecting other receipt properties.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: receiptId
          schema:
            type: string
          required: true
          description: Unique receipt identifier (bigint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
            example:
              location: "Warehouse B, Zone 2"
      responses:
        "200":
          description: Receipt location updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Receipt location updated successfully"
                  data:
                    $ref: "#/components/schemas/WarehouseReceipt"
        "400":
          description: Missing or invalid location field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/{receiptId}/reject:
    put:
      tags:
        - Receipts
      summary: Reject warehouse receipt
      description: Mark a warehouse receipt as rejected with a specified reason
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: receiptId
          schema:
            type: string
          required: true
          description: Unique receipt identifier (bigint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectReceiptRequest"
      responses:
        "200":
          description: Receipt rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Warehouse Receipt rejected successfully"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/{receiptId}/summary:
    get:
      tags:
        - Receipts
      summary: Get receipt summary (status, totals, counts)
      description: Retrieve quick summary with total pieces, weight, and freight count
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: receiptId
          schema:
            type: string
          required: true
          description: Unique receipt identifier (bigint)
      responses:
        "200":
          description: Receipt summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ReceiptSummary"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/warehouse-receipt/{receiptId}/audit-logs:
    get:
      tags:
        - Receipts
      summary: Get audit logs for a warehouse receipt
      description: Retrieve all audit logs associated with a specific warehouse receipt, showing status changes and updates over time.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: receiptId
          schema:
            type: string
          required: true
          description: Unique receipt identifier (bigint)
      responses:
        "200":
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/verification/{verificationId}:
    get:
      tags:
        - Receipts
      summary: Get receipts by verification ID
      description: Retrieve all receipts associated with an ID verification form
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: verificationId
          schema:
            type: string
          required: true
          description: Verification ID (bigint)
      responses:
        "200":
          description: Receipts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WarehouseReceipt"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/customer-station:
    get:
      tags:
        - Receipts
      summary: Get receipts by customer and station
      description: Retrieve all receipts for a specific customer/station combination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: customerId
          schema:
            type: integer
          required: true
          description: Customer ID
        - in: query
          name: stationId
          schema:
            type: integer
          required: true
          description: Station ID
      responses:
        "200":
          description: Receipts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WarehouseReceipt"
        "400":
          description: customerId and stationId are required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/warehouse-receipt/pro-detail/{pro}:
    get:
      tags:
        - Receipts
      summary: Get PRO header details by PRO number
      description: |
        Retrieve detailed PRO (Progressive Rotating Order) information for a given PRO number.

        **Flow:**
        1. Checks database first (Warehouse_RM_Pro_Detail table)
        2. If not found, reads from CSV file in FTP folder
        3. Validates and saves CSV data to database for future use
        4. Checks for duplicate warehouse receipts (prevents reuse)
        5. Returns formatted response with all PRO details

        **Response Fields:**
        - proDetailId: Unique identifier for the PRO detail record
        - driver: Driver number handling the shipment
        - shipper: Name of the shipper
        - shipperAccountNumber: Account number of the shipper
        - consignee: Customer/consignee name
        - consigneeAccountNumber: Customer account number
        - customerReferenceNumber: Reference number provided by customer
        - carrier: Carrier company name
        - city: Destination city
        - weight: Total weight in the shipment
        - pieces: Number of pieces in shipment
        - proNumber: PRO (Progressive Rotating Order) number
        - proDate: Date the PRO was created
        - hazmat: Hazardous materials indicator (Y/N)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pro
          schema:
            type: string
          required: true
          description: PRO (Progressive Rotating Order) number
          example: "21987292"
      responses:
        "200":
          description: PRO header details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      proDetailId:
                        type: integer
                        example: 1
                      driver:
                        type: string
                        example: "D123"
                      shipper:
                        type: string
                        example: "Test Shipper Inc"
                      shipperAccountNumber:
                        type: string
                        example: "ACC123"
                      consignee:
                        type: string
                        example: "ABC Customer"
                      consigneeAccountNumber:
                        type: string
                        example: "CACC456"
                      customerReferenceNumber:
                        type: string
                        description: Optional customer reference
                        example: "REF789"
                      carrier:
                        type: string
                        example: "Shiva Test Carrier"
                      city:
                        type: string
                        example: "New York"
                      weight:
                        type: integer
                        example: 100
                      pieces:
                        type: integer
                        example: 5
                      proNumber:
                        type: string
                        example: "PRO123456"
                      proDate:
                        type: string
                        format: date
                        example: "2026-05-08"
                      hazmat:
                        type: string
                        enum: ["Y", "N"]
                        example: "N"
        "400":
          description: PRO number is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "PRO number is required"
        "404":
          description: PRO detail not found in database or CSV file
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "No PRO detail found for PRO number: PRO123456 (not in database or CSV file)"
        "409":
          description: Duplicate - Carrier and PRO already added in another Record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Duplicate - Carrier "Shiva Test Carrier" with PRO "PRO123456" already added in another Record'
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/warehouse-receipt/label-print:
    post:
      tags:
        - Receipts
      summary: Generate and print labels for a warehouse receipt
      description: >
        Generate label data for a receipt and send to printer.  
        - **printerIP**, **printerPort**, and **receiptNumber** must be provided as query parameters.  
        - Additional label data can be provided in the request body.  
        - If full label payload is given in the body, it will be used directly.  
        - If not, the service will fetch missing data from the database using the receiptNumber.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: printerIP
          required: true
          schema:
            type: string
          description: IP address of the target printer
        - in: query
          name: printerPort
          required: true
          schema:
            type: integer
          description: Port number of the target printer
        - in: query
          name: receiptNumber
          required: true
          schema:
            type: integer
          description: Warehouse receipt number to print
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelPrintRequest"
            examples:
              fullPayload:
                summary: Full label payload provided
                value:
                  customerName: "ACME Corp"
                  packageId: "PKG123"
                  shipper: "John Doe"
                  carrierName: "FedEx"
                  proNumber: "PRO987"
                  destination: "New York"
                  pieces: 10
                  labelCount: 2
              minimalPayload:
                summary: Only receiptNumber in query, no body
                value: {}
      responses:
        "200":
          description: Labels generated and sent to printer successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Label print sent successfully"
                  data:
                    type: object
                    properties:
                      printedTo:
                        type: string
                        example: "192.168.1.100"
                      printerPort:
                        type: integer
                        example: 9100
                      printData:
                        $ref: "#/components/schemas/LabelPrintData"
        "400":
          description: Invalid request - missing printerIP, printerPort, or receiptNumber
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateTemporaryWarehouseReceipt:
      type: object
      required:
        - verificationId
        - customerId
        - stationId
        - carrierId
        - status
        - shipper
        - receivedBy
        - location
        - destination
        - proNumber
        - packageId
      properties:
        verificationId:
          type: integer
          example: 100000033
          description: ID verification record ID
        shipper:
          type: string
          example: "ABC Logistics Inc"
          description: Shipper name
        customerId:
          type: integer
          example: 51
        stationId:
          type: integer
          example: 93
        carrierId:
          type: integer
          example: 52
        status:
          type: string
          enum: [INITIATE, IN_PROGRESS, COMPLETED, HOLD]
          example: "INITIATE"
          description: Initial receipt status
        receivedBy:
          type: string
          example: "John Warehouse"
          description: Person who received the shipment
        location:
          type: string
          example: "Warehouse A, Zone 1"
          description: Storage location
        destination:
          type: string
          example: "Final Destination"
          description: Destination address
        proNumber:
          type: string
          example: "PRO1234511"
          description: PRO number
        packageId:
          type: string
          example: "PKG-001"
          description: Package ID

    WarehouseReceiptTemp:
      type: object
      properties:
