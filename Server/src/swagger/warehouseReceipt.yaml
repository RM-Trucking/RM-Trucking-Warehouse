          example: "2026-04-06T10:00:00Z"
          description: Auto-generated timestamp
        shipper:
          type: string
          example: "ABC Logistics Inc"
        customerId:
          type: integer
          example: 51
        stationId:
          type: integer
          example: 93
        carrierId:
          type: integer
          example: 52
